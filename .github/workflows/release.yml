name: Release

# Builds, signs, notarizes and publishes a release, then updates the website and the Homebrew cask.
# Runs on every push to a release/<major>.<minor> branch: the first push releases <major>.<minor>, later pushes
# release the next patch (see Packaging/release-version.sh). Can also be started by hand from the Actions tab.
on:
  push:
    branches: ['release/*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 1.1
        required: true

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    env:
      HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out version
        env:
          REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          VERSION=$(Packaging/release-version.sh "${REQUESTED#release/}") || { echo "::error::Can't release from '$REQUESTED'"; exit 1; }
          echo "Releasing $VERSION from $GITHUB_REF_NAME" | tee -a "$GITHUB_STEP_SUMMARY"
          BUILD=$(( $(git tag -l 'v*' | wc -l) + 1 ))
          { echo "VERSION=$VERSION"; echo "TAG=v$VERSION"; echo "BUILD=$BUILD"; echo "KEYCHAIN=$RUNNER_TEMP/release.keychain-db"; } >> "$GITHUB_ENV"

      - name: Import Developer ID certificate
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

      - name: Store notarization credentials
        env:
          KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          echo "$KEY_P8" > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials DisplayDeck --key "$RUNNER_TEMP/notary.p8" --key-id "$KEY_ID" --issuer "$ISSUER_ID" --keychain "$KEYCHAIN"
          rm "$RUNNER_TEMP/notary.p8"

      # Use the newest stable Xcode on the runner: apps get the current macOS look only when built with a recent SDK.
      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_[0-9]*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          echo "Using $XCODE"

      - name: Show toolchain
        run: |
          ls -d /Applications/Xcode*.app
          xcodebuild -version && swiftc --version

      - name: Build, sign and notarize
        env:
          TELEMETRYDECK_APP_ID: ${{ vars.TELEMETRYDECK_APP_ID }}
        run: NOTARY_KEYCHAIN="$KEYCHAIN" ./build.sh --release

      # Sparkle verifies every update against this EdDSA signature. The site deploy turns appcast.json into the
      # update feed (see Packaging/site-data.py).
      - name: Sign update for Sparkle
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle_key"
          SIGNATURE=$(.sparkle/Sparkle-*/bin/sign_update --ed-key-file "$RUNNER_TEMP/sparkle_key" "build/DisplayDeck-$VERSION.dmg")
          rm "$RUNNER_TEMP/sparkle_key"
          ED_SIGNATURE=$(sed -E 's/.*sparkle:edSignature="([^"]+)".*/\1/' <<< "$SIGNATURE")
          LENGTH=$(sed -E 's/.* (sparkle:)?length="([0-9]+)".*/\2/' <<< "$SIGNATURE")
          printf '{"version": "%s", "build": %s, "minimumSystemVersion": "14.0", "length": %s, "edSignature": "%s"}\n' \
            "$VERSION" "$BUILD" "$LENGTH" "$ED_SIGNATURE" > build/appcast.json
          cat build/appcast.json

      - name: Write release notes
        run: |
          # The CHANGELOG.md section for this version, or the commits since the previous release.
          awk -v v="$VERSION" '$0 == "## " v {on=1; next} /^## / {on=0} on' CHANGELOG.md | sed '/./,$!d' > "$RUNNER_TEMP/notes.md"
          if [[ ! -s "$RUNNER_TEMP/notes.md" ]]; then
            PREVIOUS=$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)
            git log --no-merges --pretty='- %s' ${PREVIOUS:+"$PREVIOUS..HEAD"} > "$RUNNER_TEMP/notes.md"
          fi
          cat "$RUNNER_TEMP/notes.md" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "build/DisplayDeck-$VERSION.dmg" build/appcast.json \
            --target "$GITHUB_SHA" --title "DisplayDeck $VERSION" --notes-file "$RUNNER_TEMP/notes.md"

      # Releases created with GITHUB_TOKEN don't trigger other workflows, so start the site deploy explicitly,
      # from this release branch so the site matches what was just released.
      - name: Update website
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "$GITHUB_REF_NAME"

      - name: Update Homebrew cask
        if: env.HOMEBREW_TAP_DEPLOY_KEY != ''
        run: |
          SHA=$(shasum -a 256 "build/DisplayDeck-$VERSION.dmg" | cut -d' ' -f1)
          mkdir -p ~/.ssh
          echo "$HOMEBREW_TAP_DEPLOY_KEY" > ~/.ssh/tap_key && chmod 600 ~/.ssh/tap_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o StrictHostKeyChecking=accept-new"
          git clone git@github.com:rahgurung/homebrew-tap.git "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          mkdir -p Casks
          sed -e "s/@VERSION@/$VERSION/" -e "s/@SHA256@/$SHA/" "$GITHUB_WORKSPACE/Packaging/displaydeck.rb" > Casks/displaydeck.rb
          git add Casks/displaydeck.rb
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "displaydeck $VERSION"
          git push

      - name: Clean up keychain
        if: always()
        run: '[[ -z "${KEYCHAIN:-}" ]] || security delete-keychain "$KEYCHAIN" 2>/dev/null || true'
