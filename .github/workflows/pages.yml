name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths: [docs/**, .github/workflows/pages.yml]
  # Rebuild on every release so the site's download links and version list stay current.
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write releases.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/releases?per_page=100" --jq '
            [.[] | select((.draft or .prerelease) | not) | {
              version: (.tag_name | ltrimstr("v")),
              date: .published_at,
              notes: .html_url,
              dmg: ([.assets[] | select(.name | endswith(".dmg")) | {url: .browser_download_url, size}] | first)
            } | select(.dmg)]' > docs/releases.json
          cat docs/releases.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        id: deployment
